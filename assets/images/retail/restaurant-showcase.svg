<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="restGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="20" y="20" width="500" height="340" rx="20" fill="url(#restBg)" filter="url(#restGlow)" stroke="#312E81" stroke-width="1.5" />
  
  <rect x="40" y="40" width="460" height="40" rx="10" fill="#1E293B" />
  <circle cx="60" cy="60" r="6" fill="#EF4444" />
  <circle cx="78" cy="60" r="6" fill="#F59E0B" />
  <circle cx="96" cy="60" r="6" fill="#10B981" />
  <text x="270" y="65" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">LOYALLOOP Table QR &amp; Guest Dining Rewards</text>

  <!-- Left Side: Table QR Code Display -->
  <g transform="translate(40, 100)">
    <rect width="210" height="230" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="105" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Table 14 • Urban Table</text>
    
    <!-- Big QR code illustration -->
    <rect x="55" y="45" width="100" height="100" rx="10" fill="#FFFFFF" />
    <path d="M65 55h30v30h-30zm6 6v18h18V61zm44-6h30v30h-30zm6 6v18h18V61zM65 99h30v30h-30zm6 6v18h18v-18zm44 0h12v12h-12zm18 0h12v30h-12zm-18 18h12v12h-12z" fill="#0F172A" />
    
    <text x="105" y="170" fill="#FEF3C7" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Scan to Earn Dining Points</text>
    <text x="105" y="190" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">No app download required</text>
    <rect x="25" y="200" width="160" height="20" rx="10" fill="#F59E0B" fill-opacity="0.15" />
    <text x="105" y="214" fill="#FBBF24" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Instant 50 Pts On Check-In</text>
  </g>

  <!-- Right Side: Guest Reward Unlocked -->
  <g transform="translate(270, 100)">
    <rect width="230" height="230" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">DINE-IN CAMPAIGN</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Welcome Back, Sarah!</text>
    
    <rect x="20" y="70" width="190" height="60" rx="10" fill="#451A03" stroke="#B45309" stroke-width="1" />
    <circle cx="45" cy="100" r="16" fill="#FDE68A" />
    <text x="45" y="105" fill="#78350F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" text-anchor="middle">☕</text>
    <text x="72" y="94" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Complimentary Dessert</text>
    <text x="72" y="112" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="10">4th Visit Milestone Perk</text>

    <!-- Visit Progress Tracker -->
    <text x="20" y="150" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Visits to VIP Status: 4 of 5</text>
    <rect x="20" y="160" width="190" height="8" rx="4" fill="#0F172A" />
    <rect x="20" y="160" width="152" height="8" rx="4" fill="#10B981" />

    <rect x="20" y="185" width="190" height="32" rx="8" fill="#10B981" />
    <text x="115" y="206" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Redeem With Server</text>
  </g>
</svg>
