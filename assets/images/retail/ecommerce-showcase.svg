<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="ecomGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="20" y="20" width="500" height="340" rx="20" fill="#0F172A" filter="url(#ecomGlow)" stroke="#334155" stroke-width="1.5" />
  
  <rect x="40" y="40" width="460" height="40" rx="10" fill="#1E293B" />
  <circle cx="60" cy="60" r="6" fill="#EF4444" />
  <circle cx="78" cy="60" r="6" fill="#F59E0B" />
  <circle cx="96" cy="60" r="6" fill="#10B981" />
  <text x="270" y="65" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">LOYALLOOP Headless &amp; DTC Cart Checkout Widget</text>

  <!-- Left: Checkout Mini Preview -->
  <g transform="translate(40, 100)">
    <rect width="210" height="230" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ORDER SUMMARY</text>
    <text x="20" y="60" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Silk Botanical Serum (x1)</text>
    <text x="180" y="60" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="end">$68.00</text>
    
    <text x="20" y="90" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Hydration Mist (x1)</text>
    <text x="180" y="90" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="end">$34.00</text>

    <line x1="20" y1="110" x2="190" y2="110" stroke="#334155" stroke-width="1" />

    <text x="20" y="130" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Subtotal</text>
    <text x="180" y="130" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">$102.00</text>

    <text x="20" y="155" fill="#10B981" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Loyalty Discount (500 pts)</text>
    <text x="180" y="155" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="end">-$10.00</text>

    <line x1="20" y1="175" x2="190" y2="175" stroke="#334155" stroke-width="1" />

    <text x="20" y="200" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Total Due</text>
    <text x="180" y="200" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="end">$92.00</text>
  </g>

  <!-- Right: Loyalty Points Redemption Slider -->
  <g transform="translate(270, 100)">
    <rect width="230" height="230" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">LOYALLOOP 1-CLICK REDEEM</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Redeem Points on this order</text>
    
    <rect x="20" y="70" width="190" height="70" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="35" y="95" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Your Balance: 1,450 pts</text>
    <text x="35" y="122" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Redeeming 500 pts ($10)</text>

    <text x="20" y="165" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Slide to adjust point redemption:</text>
    <rect x="20" y="175" width="190" height="6" rx="3" fill="#334155" />
    <rect x="20" y="175" width="95" height="6" rx="3" fill="#4F46E5" />
    <circle cx="115" cy="178" r="8" fill="#818CF8" />

    <rect x="20" y="195" width="190" height="24" rx="6" fill="#4F46E5" fill-opacity="0.2" />
    <text x="115" y="211" fill="#C7D2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">You will also earn +92 pts today!</text>
  </g>
</svg>
