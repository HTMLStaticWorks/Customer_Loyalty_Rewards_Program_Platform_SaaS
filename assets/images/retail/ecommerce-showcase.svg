<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="ecomGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="20" y="20" width="500" height="340" rx="20" fill="#0F172A" filter="url(#ecomGlow)" stroke="#334155" stroke-width="1.5" />
  
  <rect x="35" y="40" width="470" height="40" rx="10" fill="#1E293B" />
  <circle cx="55" cy="60" r="6" fill="#EF4444" />
  <circle cx="73" cy="60" r="6" fill="#F59E0B" />
  <circle cx="91" cy="60" r="6" fill="#10B981" />
  <text x="270" y="65" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">LOYALLOOP Headless &amp; DTC Checkout Widget</text>

  <!-- Left: Checkout Mini Preview -->
  <g transform="translate(35, 100)">
    <rect width="225" height="230" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ORDER SUMMARY</text>
    
    <text x="16" y="60" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Botanical Serum (x1)</text>
    <text x="208" y="60" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="end">$68.00</text>
    
    <text x="16" y="90" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Hydration Mist (x1)</text>
    <text x="208" y="90" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="end">$34.00</text>

    <line x1="16" y1="110" x2="208" y2="110" stroke="#334155" stroke-width="1" />

    <text x="16" y="130" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Subtotal</text>
    <text x="208" y="130" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="end">$102.00</text>

    <text x="16" y="155" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Loyalty Perk (500 pts)</text>
    <text x="208" y="155" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="end">-$10.00</text>

    <line x1="16" y1="175" x2="208" y2="175" stroke="#334155" stroke-width="1" />

    <text x="16" y="200" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Total Due</text>
    <text x="208" y="200" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" text-anchor="end">$92.00</text>
  </g>

  <!-- Right: Loyalty Points Redemption Slider -->
  <g transform="translate(280, 100)">
    <rect width="225" height="230" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="30" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">LOYALLOOP 1-CLICK REDEEM</text>
    <text x="16" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Redeem Points On Order</text>
    
    <rect x="16" y="70" width="193" height="70" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="26" y="95" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Your Balance: 1,450 pts</text>
    <text x="26" y="122" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Redeeming 500 pts ($10)</text>

    <text x="16" y="165" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5">Slide to adjust redemption:</text>
    <rect x="16" y="175" width="193" height="6" rx="3" fill="#334155" />
    <rect x="16" y="175" width="96" height="6" rx="3" fill="#4F46E5" />
    <circle cx="112" cy="178" r="8" fill="#818CF8" />

    <rect x="16" y="195" width="193" height="24" rx="6" fill="#4F46E5" fill-opacity="0.2" />
    <text x="112" y="211" fill="#C7D2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Earn +92 pts today!</text>
  </g>
</svg>
