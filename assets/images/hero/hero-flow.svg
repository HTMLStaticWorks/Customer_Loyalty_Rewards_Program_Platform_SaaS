<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative rings -->
  <circle cx="320" cy="260" r="230" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="320" cy="260" r="150" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Center Hub: LOYALLOOP Engine -->
  <g transform="translate(245, 185)" filter="url(#softGlow)">
    <rect width="150" height="150" rx="24" fill="url(#flowGrad1)" />
    <circle cx="75" cy="60" r="28" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M63 60C63 53.3726 68.3726 48 75 48C81.6274 48 87 53.3726 87 60C87 66.6274 81.6274 72 75 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="32 8" />
    <circle cx="75" cy="60" r="4.5" fill="#FBBF24" />
    <text x="75" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">LOYALLOOP</text>
    <text x="75" y="122" fill="#C7D2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">REWARDS ENGINE</text>
  </g>

  <!-- Step 1: Customer & Purchase (Top Left) -->
  <g transform="translate(30, 40)" filter="url(#softGlow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="38" cy="37" r="20" fill="#EEF2FF" />
    <path d="M30 43C30 38.5817 33.5817 35 38 35C42.4183 35 46 38.5817 46 43" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <circle cx="38" cy="30" r="5" stroke="#4F46E5" stroke-width="2" />
    <text x="68" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">01. Purchase</text>
    <text x="68" y="50" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">In-Store / DTC Cart</text>
  </g>

  <!-- Step 2: Earn Points (Top Right) -->
  <g transform="translate(430, 40)" filter="url(#softGlow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="38" cy="37" r="20" fill="#FEF3C7" />
    <path d="M38 27L40 32L45 33L41 37L42 42L38 39L34 42L35 37L31 33L36 32Z" fill="#D97706" />
    <text x="68" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">02. Earn Points</text>
    <text x="68" y="50" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+250 Points</text>
  </g>

  <!-- Step 3: Unlock Reward (Bottom Right) -->
  <g transform="translate(430, 400)" filter="url(#softGlow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="38" cy="37" r="20" fill="#ECFDF5" />
    <path d="M31 31H45V43H31Z" fill="#10B981" />
    <path d="M38 31V43M31 37H45" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="68" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">03. Unlock Perk</text>
    <text x="68" y="50" fill="#059669" font-family="'Inter', sans-serif" font-size="11" font-weight="600">$15 Off Unlocked</text>
  </g>

  <!-- Step 4: Return & Repeat (Bottom Left) -->
  <g transform="translate(30, 400)" filter="url(#softGlow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="38" cy="37" r="20" fill="#F5F3FF" />
    <path d="M32 37A6 6 0 1 1 44 37A6 6 0 0 1 32 37" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />
    <path d="M41 33L45 37L41 41" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">04. Return &amp; Repeat</text>
    <text x="68" y="50" fill="#7C3AED" font-family="'Inter', sans-serif" font-size="11" font-weight="600">3.4x Lifetime Value</text>
  </g>

  <!-- Flowing Curved Arrows with Animated Look -->
  <path d="M210 77 C280 77, 340 77, 430 77" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="426,73 434,77 426,81" fill="#6366F1" />

  <path d="M520 114 C520 200, 520 300, 520 400" stroke="#10B981" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="516,396 520,404 524,396" fill="#10B981" />

  <path d="M430 437 C340 437, 280 437, 210 437" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="214,441 206,437 214,433" fill="#7C3AED" />

  <path d="M120 400 C120 300, 120 200, 120 114" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="124,118 120,110 116,118" fill="#4F46E5" />

  <!-- Floating badges & micro-cards -->
  <g transform="translate(20, 230)" filter="url(#softGlow)">
    <rect width="145" height="42" rx="21" fill="#0F172A" />
    <circle cx="21" cy="21" r="10" fill="#F59E0B" />
    <text x="21" y="25" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">★</text>
    <text x="38" y="25" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Gold Member</text>
  </g>

  <g transform="translate(460, 230)" filter="url(#softGlow)">
    <rect width="155" height="42" rx="21" fill="#0F172A" />
    <circle cx="21" cy="21" r="10" fill="#10B981" />
    <path d="M17 21L20 24L26 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="38" y="25" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">5 Visits Completed</text>
  </g>
</svg>
