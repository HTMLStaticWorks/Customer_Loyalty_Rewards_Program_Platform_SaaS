<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative rings -->
  <circle cx="330" cy="260" r="230" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="330" cy="260" r="150" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Center Hub: LOYALLOOP Engine -->
  <g transform="translate(255, 185)" filter="url(#softGlow)">
    <rect width="150" height="150" rx="24" fill="url(#flowGrad1)" />
    <circle cx="75" cy="60" r="28" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M63 60C63 53.3726 68.3726 48 75 48C81.6274 48 87 53.3726 87 60C87 66.6274 81.6274 72 75 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="32 8" />
    <circle cx="75" cy="60" r="4.5" fill="#FBBF24" />
    <text x="75" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">LOYALLOOP</text>
    <text x="75" y="122" fill="#C7D2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">REWARDS ENGINE</text>
  </g>

  <!-- Step 1: Customer & Purchase (Top Left) -->
  <g transform="translate(20, 40)" filter="url(#softGlow)">
    <rect width="200" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="37" r="20" fill="#EEF2FF" />
    <path d="M28 43C28 38.5817 31.5817 35 36 35C40.4183 35 44 38.5817 44 43" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <circle cx="36" cy="30" r="5" stroke="#4F46E5" stroke-width="2" />
    <text x="66" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">01. Purchase</text>
    <text x="66" y="50" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">In-Store / DTC Cart</text>
  </g>

  <!-- Step 2: Earn Points (Top Right) -->
  <g transform="translate(440, 40)" filter="url(#softGlow)">
    <rect width="200" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="37" r="20" fill="#FEF3C7" />
    <path d="M36 27L38 32L43 33L39 37L40 42L36 39L32 42L33 37L29 33L34 32Z" fill="#D97706" />
    <text x="66" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">02. Earn Points</text>
    <text x="66" y="50" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+250 Points</text>
  </g>

  <!-- Step 3: Unlock Reward (Bottom Right) -->
  <g transform="translate(440, 400)" filter="url(#softGlow)">
    <rect width="200" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="37" r="20" fill="#ECFDF5" />
    <path d="M29 31H43V43H29Z" fill="#10B981" />
    <path d="M36 31V43M29 37H43" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="66" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">03. Unlock Perk</text>
    <text x="66" y="50" fill="#059669" font-family="'Inter', sans-serif" font-size="11" font-weight="600">$15 Off Unlocked</text>
  </g>

  <!-- Step 4: Return & Repeat (Bottom Left) -->
  <g transform="translate(20, 400)" filter="url(#softGlow)">
    <rect width="200" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="37" r="20" fill="#F5F3FF" />
    <path d="M30 37A6 6 0 1 1 42 37A6 6 0 0 1 30 37" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />
    <path d="M39 33L43 37L39 41" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="66" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">04. Return &amp; Repeat</text>
    <text x="66" y="50" fill="#7C3AED" font-family="'Inter', sans-serif" font-size="11" font-weight="600">3.4x Lifetime Value</text>
  </g>

  <!-- Flowing Curved Arrows with Animated Look -->
  <path d="M220 77 C290 77, 360 77, 440 77" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="436,73 444,77 436,81" fill="#6366F1" />

  <path d="M540 114 C540 200, 540 300, 540 400" stroke="#10B981" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="536,396 540,404 544,396" fill="#10B981" />

  <path d="M440 437 C360 437, 290 437, 220 437" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="224,441 216,437 224,433" fill="#7C3AED" />

  <path d="M120 400 C120 300, 120 200, 120 114" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="124,118 120,110 116,118" fill="#4F46E5" />

  <!-- Floating badges & micro-cards -->
  <g transform="translate(15, 230)" filter="url(#softGlow)">
    <rect width="155" height="42" rx="21" fill="#0F172A" />
    <circle cx="21" cy="21" r="10" fill="#F59E0B" />
    <text x="21" y="25" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">★</text>
    <text x="38" y="25" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Gold Member</text>
  </g>

  <g transform="translate(480, 230)" filter="url(#softGlow)">
    <rect width="165" height="42" rx="21" fill="#0F172A" />
    <circle cx="21" cy="21" r="10" fill="#10B981" />
    <path d="M17 21L20 24L26 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="38" y="25" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">5 Visits Completed</text>
  </g>
</svg>
