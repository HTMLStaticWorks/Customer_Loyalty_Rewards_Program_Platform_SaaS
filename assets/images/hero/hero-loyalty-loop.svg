<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="loopGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="loopGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="loopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4F46E5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Big Infinity / Loop Orbit Paths -->
  <path d="M220 270 C220 180, 100 180, 100 270 C100 360, 220 360, 340 270 C460 180, 580 180, 580 270 C580 360, 460 360, 340 270 Z" stroke="url(#loopGradA)" stroke-width="8" stroke-linecap="round" opacity="0.35" />
  <path d="M220 270 C220 180, 100 180, 100 270 C100 360, 220 360, 340 270 C460 180, 580 180, 580 270 C580 360, 460 360, 340 270 Z" stroke="url(#loopGradB)" stroke-width="3" stroke-dasharray="14 10" />

  <!-- Central Nexus Card -->
  <g transform="translate(265, 215)" filter="url(#loopGlow)">
    <rect width="150" height="110" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="75" cy="40" r="20" fill="#4F46E5" fill-opacity="0.2" />
    <path d="M68 40C68 36.134 71.134 33 75 33C78.866 33 82 36.134 82 40C82 43.866 78.866 47 75 47" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="75" cy="40" r="3" fill="#34D399" />
    <text x="75" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">THE LOYALTY</text>
    <text x="75" y="92" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LOOP™</text>
  </g>

  <!-- Step 1: Discover (Top Left) -->
  <g transform="translate(60, 130)" filter="url(#loopGlow)">
    <rect width="130" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#EEF2FF" />
    <text x="26" y="30" fill="#4F46E5" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">01</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Discover</text>
    <text x="48" y="38" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="500">QR / Web / POS</text>
  </g>

  <!-- Step 2: Purchase (Far Left Bottom) -->
  <g transform="translate(40, 310)" filter="url(#loopGlow)">
    <rect width="130" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#FDF2F8" />
    <text x="26" y="30" fill="#DB2777" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">02</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Purchase</text>
    <text x="48" y="38" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="500">First Order</text>
  </g>

  <!-- Step 3: Earn (Bottom Left-Center) -->
  <g transform="translate(190, 420)" filter="url(#loopGlow)">
    <rect width="140" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#FEF3C7" />
    <text x="26" y="30" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">03</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Earn Points</text>
    <text x="48" y="38" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">+10 pts / $1</text>
  </g>

  <!-- Step 4: Reward (Bottom Right-Center) -->
  <g transform="translate(370, 420)" filter="url(#loopGlow)">
    <rect width="140" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#ECFDF5" />
    <text x="26" y="30" fill="#059669" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">04</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Reward</text>
    <text x="48" y="38" fill="#059669" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Perk Unlocked</text>
  </g>

  <!-- Step 5: Return (Far Right Bottom) -->
  <g transform="translate(510, 310)" filter="url(#loopGlow)">
    <rect width="130" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#F0FDF4" />
    <text x="26" y="30" fill="#16A34A" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">05</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Return</text>
    <text x="48" y="38" fill="#16A34A" font-family="'Inter', sans-serif" font-size="10" font-weight="500">2nd Visit</text>
  </g>

  <!-- Step 6: Engage (Top Right) -->
  <g transform="translate(480, 130)" filter="url(#loopGlow)">
    <rect width="140" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#EFF6FF" />
    <text x="26" y="30" fill="#2563EB" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">06</text>
    <text x="48" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Engage</text>
    <text x="48" y="38" fill="#2563EB" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Push &amp; SMS Offer</text>
  </g>

  <!-- Step 7: Purchase Again (Top Center) -->
  <g transform="translate(265, 60)" filter="url(#loopGlow)">
    <rect width="160" height="56" rx="14" fill="#4F46E5" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#FFFFFF" fill-opacity="0.2" />
    <text x="28" y="32" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">07</text>
    <text x="50" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Purchase Again</text>
    <text x="50" y="40" fill="#C7D2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Permanent Regular</text>
  </g>
</svg>
