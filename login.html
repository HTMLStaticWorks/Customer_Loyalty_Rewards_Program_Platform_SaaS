<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Login | LOYALLOOP</title>
  <meta name="description" content="Sign in to your LOYALLOOP merchant account to manage loyalty cards and rewards campaigns.">

  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-body min-vh-100 d-flex align-items-center justify-content-center py-5 position-relative">

  <!-- Top Right Corner RTL and Theme Toggle Buttons -->
  <div class="position-absolute top-0 end-0 m-3 m-md-4 d-flex align-items-center gap-2" style="z-index: 1050;">
    <button class="rtl-toggle-btn" type="button" aria-label="Switch to RTL layout" title="Switch to RTL layout">RTL</button>
    <button class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
      <i class="bi bi-moon-stars-fill theme-icon-light"></i>
      <i class="bi bi-sun-fill theme-icon-dark"></i>
    </button>
  </div>

  <!-- Login Content -->
  <main class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="auth-card">
          <!-- Brandname inside the box in top center -->
          <div class="text-center mb-4">
            <a class="navbar-brand-custom justify-content-center mb-2" href="index.html" aria-label="LOYALLOOP Home">
              <img src="assets/icons/logo.svg" alt="LOYALLOOP Logo" width="38" height="38" class="brand-icon">
              <span class="fs-4">LOYALLOOP</span>
            </a>
            <h1 class="h3 mb-1 fw-bold">Welcome Back</h1>
            <p class="text-muted small">Sign in to manage your loyalty cards and rewards campaigns.</p>
          </div>

          <form class="needs-validation" data-demo-form novalidate>
            <!-- Input Field 1: Email (Separate Line) -->
            <div class="mb-3">
              <label for="loginEmail" class="form-label-custom">Work Email Address</label>
              <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="merchant@brand.com" required>
              <div class="invalid-feedback">Please provide a valid email.</div>
            </div>

            <!-- Input Field 2: Password (Separate Line) -->
            <div class="mb-3">
              <label for="loginPassword" class="form-label-custom">Password</label>
              <div class="position-relative">
                <input type="password" class="form-control form-control-custom" id="loginPassword" placeholder="••••••••" required>
                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <!-- Remember Me and Forgot Password on Same Line -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check mb-0">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
              </div>
              <a href="forgot-password.html" class="small text-primary fw-semibold">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">
              Sign In to Account
            </button>

            <div class="position-relative my-4 text-center">
              <hr class="border-custom">
              <span class="position-absolute top-50 start-50 translate-middle bg-surface px-3 text-muted small font-heading">OR CONTINUE WITH</span>
            </div>

            <!-- Google and Apple Social Icons at Bottom -->
            <div class="row g-2 mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-outline-custom w-100 d-flex align-items-center justify-content-center gap-2" onclick="alert('Demo SSO: Authenticating via Google...');">
                  <i class="bi bi-google"></i>
                  <span>Google</span>
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-custom w-100 d-flex align-items-center justify-content-center gap-2" onclick="alert('Demo SSO: Authenticating via Apple ID...');">
                  <i class="bi bi-apple"></i>
                  <span>Apple</span>
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4 pt-3 border-top border-custom">
            <p class="text-muted small mb-0">
              Don't have an account yet? <a href="signup.html" class="fw-bold text-primary">Sign Up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
